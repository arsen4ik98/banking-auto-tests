name: Banking QA Automation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create application.properties
        env:
          PROPERTIES_SECRET: ${{ secrets.TEST_PROPERTIES }}
        run: |
          mkdir -p src/test/resources
          echo "$PROPERTIES_SECRET" > src/test/resources/application.properties

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile project & Download dependencies
        run: mvn test-compile -ntp

      - name: Install Playwright Browsers & OS Dependencies
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps" -ntp

      - name: Run Maven Tests
        run: mvn test -ntp

      - name: Upload Allure Results as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7